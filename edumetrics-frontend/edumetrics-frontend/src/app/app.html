<div class="app-layout">
  <!-- Barra de Navegación Superior -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">EduMetrics Analytics</h1>
          <span class="brand-subtitle">Plataforma de Rendimiento Académico & Alerta Temprana</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-secondary btn-refresh" (click)="loadAllData()" [disabled]="isLoading">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [class.spinning]="isLoading">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          Actualizar
        </button>
      </div>
    </div>

    <!-- Pestañas de Navegación -->
    <nav class="nav-tabs-wrapper">
      <div class="nav-tabs">
        <button
          class="nav-tab"
          [class.active]="activeTab === 'dashboard'"
          (click)="setTab('dashboard')"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          Dashboard Analítico
        </button>

        <button
          class="nav-tab"
          [class.active]="activeTab === 'ranking'"
          (click)="setTab('ranking')"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="7"></circle>
            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
          </svg>
          Cuadro de Honor (Ranking)
        </button>

        <button
          class="nav-tab"
          [class.active]="activeTab === 'riesgo'"
          (click)="setTab('riesgo')"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          Alerta Temprana
          <span class="tab-badge" *ngIf="riskData.length > 0">{{ riskData.length }}</span>
        </button>

        <button
          class="nav-tab"
          [class.active]="activeTab === 'carga'"
          (click)="setTab('carga')"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Carga Masiva de Actas
        </button>
      </div>
    </nav>
  </header>

  <!-- Contenido Principal -->
  <main class="main-content">
    <!-- Alerta de Conexión si el backend está caído -->
    <div *ngIf="hasError" class="backend-offline-banner animate-fade-in">
      <div class="banner-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div>
        <strong>No se pudo conectar con el Backend (FastAPI).</strong>
        <p>Asegúrate de que el servidor esté corriendo en <code>http://localhost:8000</code> ejecutando: <code>uvicorn app.main:app --reload</code></p>
      </div>
    </div>

    <!-- Pestaña 1: Dashboard Analítico -->
    <section *ngIf="activeTab === 'dashboard'" class="animate-fade-in">
      <!-- Tarjetas de KPIs -->
      <app-kpi-cards [kpis]="kpis"></app-kpi-cards>

      <!-- Gráficos Estadísticos -->
      <div class="charts-grid">
        <app-correlation-chart [correlationData]="correlationData"></app-correlation-chart>
        <app-course-failure-chart [coursesData]="coursesData"></app-course-failure-chart>
      </div>
    </section>

    <!-- Pestaña 2: Cuadro de Honor / Ranking -->
    <section *ngIf="activeTab === 'ranking'" class="animate-fade-in">
      <app-ranking-table [ranking]="rankingData"></app-ranking-table>
    </section>

    <!-- Pestaña 3: Alerta Temprana -->
    <section *ngIf="activeTab === 'riesgo'" class="animate-fade-in">
      <app-risk-table [riskStudents]="riskData"></app-risk-table>
    </section>

    <!-- Pestaña 4: Carga Masiva y Semilla -->
    <section *ngIf="activeTab === 'carga'" class="animate-fade-in">
      <app-csv-uploader></app-csv-uploader>
    </section>
  </main>
</div>
